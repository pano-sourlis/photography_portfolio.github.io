<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a href="#" class="brand"><span id="site-name"></span><small id="site-tagline"></small></a>
    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <section class="hero" id="hero">
    <div class="hero-slides" id="hero-slides" aria-hidden="true"></div>

    <div class="hero-text">
      <p class="eyebrow"><span class="rule"></span><span id="hero-tagline"></span></p>
      <h1 id="hero-name"></h1>
      <p class="hero-intro" id="hero-intro"></p>
      <div class="hero-actions">
        <a href="#work" class="button">View work</a>
        <div class="hero-collections" id="hero-collections"></div>
      </div>
    </div>

    <div class="hero-caption" id="hero-caption">
      <div class="hc-count"><b id="hc-num"></b> / <span id="hc-total"></span></div>
      <div class="hc-title" id="hc-title"></div>
      <div class="hc-cat" id="hc-cat"></div>
      <div class="hc-bars" id="hc-bars"></div>
    </div>

    <a href="#work" class="scroll-cue" aria-label="Scroll to work"><span>Scroll</span>↓</a>
  </section>

  <main id="work">
    <div class="toolbar">
      <div class="filters" id="filters"></div>
      <div class="layout-toggle" id="layout-toggle" role="group" aria-label="Gallery layout">
        <button data-cols="1" aria-label="One column" title="One column"><span></span></button>
        <button data-cols="2" aria-label="Two columns" title="Two columns"><span></span><span></span></button>
      </div>
    </div>
    <div class="gallery" id="gallery"></div>
  </main>

  <section id="about" class="about">
    <h2>About</h2>
    <p id="about-text"></p>
  </section>

  <section id="contact" class="contact">
    <h2>Contact</h2>
    <p>Heres my contact info for fun.</p>
    <a id="email-link" class="button"></a>
    <a id="insta-link" class="social" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" />
        <circle cx="12" cy="12" r="4.2" />
        <circle cx="17.3" cy="6.7" r="0.9" fill="currentColor" stroke="none" />
      </svg>
    </a>
  </section>

  <footer>© <span id="year"></span> <span id="footer-name"></span></footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-prev" aria-label="Previous">‹</button>
    <figure>
      <img id="lb-img" alt="" />
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-next" aria-label="Next">›</button>
  </div>

  <script src="photos.js"></script>
  <script src="script.js"></script>
</body>
</html>
